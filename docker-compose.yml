services:
  email-classifier:
    image: ghcr.io/aaronburt/local-ai-email-classifier:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-ai-email-classifier
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - EMBEDDED_OLLAMA=${EMBEDDED_OLLAMA:-false}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi4-mini}
      - OLLAMA_REMOTE=${OLLAMA_REMOTE:-gemma4:31b-cloud}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/5 * * * *}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/node -e 'const fs=require(\"fs\"); const file=\"/tmp/heartbeat.json\"; if (!fs.existsSync(file) || Date.now()-fs.statSync(file).mtimeMs > 10*60*1000) process.exit(1);'"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
